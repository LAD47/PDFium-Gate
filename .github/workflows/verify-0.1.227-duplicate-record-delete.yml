name: Verify 0.1.227 duplicate record delete

on:
  push:
    branches:
      - fix/0.1.227-localized-defaults
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'styles.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-0.1.227-duplicate-record-delete.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.1.227-localized-defaults
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify source and generated runtime
        run: npm run check
      - name: Commit generated runtime when needed
        shell: bash
        run: |
          if git diff --quiet -- main.js main-bridge.js; then
            echo "Generated runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js main-bridge.js
          git commit -m "Build 0.1.227 duplicate record delete"
          git push
