name: Verify 0.1.227 category localization

on:
  push:
    branches:
      - fix/0.1.227-localized-defaults
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run full verification
        run: npm run check
