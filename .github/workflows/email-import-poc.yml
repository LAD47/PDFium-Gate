name: Email Import verification

on:
  push:
    branches: [feature/email-import, feature/missing-sha256-recovery]
    paths:
      - 'src/email-import/**'
      - 'src/archive-import/**'
      - 'src/metadata/**'
      - 'src/core/integrity/**'
      - 'src/main/email-import-modal.js'
      - 'src/main/00-header.js'
      - 'src/plugin/**'
      - 'src/main-bridge/**'
      - 'src/platform/**'
      - 'test/fixtures/email/**'
      - 'scripts/test-core-integrity.js'
      - 'scripts/test-email-import-*.js'
      - 'scripts/test-archive-import.js'
      - 'scripts/test-metadata-record-repository.js'
      - 'scripts/test-obsidian-vault-write.js'
      - 'scripts/check-email-import-runtime-integration.js'
      - 'scripts/check-i18n*.js'
      - 'scripts/verify/**'
      - 'scripts/source-bundle.js'
      - 'build.js'
      - 'package.json'
      - 'manifest.json'
      - 'versions.json'
      - '.github/workflows/email-import-poc.yml'
      - 'docs/email-import/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Email Import dependencies
        run: npm install --no-package-lock
      - name: Install Electron binary and configure SUID sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run Email Import Node tests
        run: npm run test:email-import
      - name: Run real Electron Chromium PDF generation test
        timeout-minutes: 3
        run: xvfb-run -a npm run test:email-import:pdf-electron
      - name: Run existing PDFium Gate checks
        run: npm run check
      - name: Verify bundled Email Import runtime integration
        run: node scripts/check-email-import-runtime-integration.js
      - name: Verify generated runtime changes are intentional and scoped
        run: |
          if git diff --quiet -- main.js; then
            echo 'Expected main.js to change after Email Import runtime integration.'
            exit 1
          fi
          git diff --exit-code -- . ':(exclude)main.js' ':(exclude)main-bridge.js'
      - name: Upload generated runtime for practical testing
        uses: actions/upload-artifact@v4
        with:
          name: email-import-runtime-${{ github.sha }}
          path: |
            main.js
            main-bridge.js
            manifest.json
            styles.css
          if-no-files-found: error
