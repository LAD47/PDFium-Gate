name: Email Import verification

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/email-import-poc.yml'
      - '.github/workflows/publish-community-release.yml'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'TRANSLATING.md'
      - 'ARCHITECTURE.md'
      - 'RELEASE.md'
      - 'build.js'
      - 'main.js'
      - 'main-bridge.js'
      - 'styles.css'
      - 'manifest.json'
      - 'versions.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/email-import-poc.yml'
      - '.github/workflows/publish-community-release.yml'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'TRANSLATING.md'
      - 'ARCHITECTURE.md'
      - 'RELEASE.md'
      - 'build.js'
      - 'main.js'
      - 'main-bridge.js'
      - 'styles.css'
      - 'manifest.json'
      - 'versions.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Email Import dependencies
        run: npm ci
      - name: Install Electron binary and configure SUID sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run Email Import Node tests
        run: npm run test:email-import
      - name: Run real Electron Chromium PDF generation test
        timeout-minutes: 3
        run: xvfb-run -a npm run test:email-import:pdf-electron
      - name: Run existing PDFium Gate checks
        run: npm run check
      - name: Verify bundled Email Import runtime integration
        run: node scripts/check-email-import-runtime-integration.js
      - name: Verify committed runtime and tracked project files remain unchanged
        run: git diff --exit-code HEAD -- .
      - name: Upload generated runtime for practical testing
        uses: actions/upload-artifact@v4
        with:
          name: email-import-runtime-${{ github.sha }}
          path: |
            main.js
            main-bridge.js
            manifest.json
            styles.css
          if-no-files-found: error
