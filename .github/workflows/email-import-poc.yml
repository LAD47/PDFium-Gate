name: Email Import parser PoC

on:
  push:
    branches: [feature/email-import]
    paths:
      - 'src/email-import/**'
      - 'test/fixtures/email/**'
      - 'scripts/test-email-import-parser.js'
      - 'package.json'
      - '.github/workflows/email-import-poc.yml'
      - 'docs/email-import/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair known synthetic inline fixture byte
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          eml = Path('test/fixtures/email/inline-image-and-pdf.eml')
          data = eml.read_bytes()
          old = b'VzO2vPg4OD]5saIX'
          new = b'VzO2vPg4ODm5saIX'
          if data.count(old) != 1:
              raise SystemExit('Expected exactly one known inline fixture corruption marker.')
          eml.write_bytes(data.replace(old, new))

          expected_path = Path('test/fixtures/email/expected.json')
          expected = json.loads(expected_path.read_text(encoding='utf-8'))
          expected['sourceHashes']['inline-image-and-pdf.eml'] = '405b9b244ca71c9bca2bbc2236ffc73b511ccc4fdc8601d7f960a938a7e0a9dc'
          expected_path.write_text(json.dumps(expected, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/email/inline-image-and-pdf.eml test/fixtures/email/expected.json
          git commit -m "Email import: repair inline PNG fixture payload"
          git push origin HEAD:feature/email-import
      - name: Install parser dependency
        run: npm install --no-package-lock --ignore-scripts
      - name: Run Email Import parser fixture tests
        run: npm run test:email-import
      - name: Run existing PDFium Gate checks
        run: npm run check
      - name: Ensure parser PoC does not change bundled runtime
        run: git diff --exit-code -- main.js main-bridge.js
